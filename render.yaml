services:
  - type: web
    name: smart-attendance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 3 --timeout 60 wsgi:application
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ATTENDANCE_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
